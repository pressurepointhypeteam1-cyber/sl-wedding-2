<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Event Video Sync</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#player{display:none;width:100%;height:100%;object-fit:contain;background:#000}
#setup{width:min(560px,94vw);padding:24px;border:1px solid #555;border-radius:14px;background:#171717}
h1{font-size:22px;margin:0 0 10px}p{color:#ccc;line-height:1.45}
button{padding:12px 16px;margin:6px 6px 6px 0;border:0;border-radius:8px;background:#eee;color:#111;font-weight:bold;cursor:pointer}
input{width:100%;padding:11px;background:#080808;color:#fff;border:1px solid #666;border-radius:6px}
#sound{display:none;position:fixed;right:12px;bottom:12px;z-index:2;opacity:.9}
#status{font-size:13px;color:#ccc}
</style>
</head>
<body>
<section id="setup">
<h1>Wedding Event Video Sync</h1>
<p>Choose a shared start time. Copy the generated event link and use that exact link on your Second Life media prim. Guests who arrive later will join the current playback position.</p>
<button data-delay="60">Start in 1 minute</button>
<button data-delay="300">Start in 5 minutes</button>
<button data-delay="600">Start in 10 minutes</button>
<input id="share" readonly placeholder="Your shared wedding event link will appear here">
<button id="copy">Copy shared link</button>
<p id="status">This page plays wedding.mp4 on a shared clock and repeats it automatically.</p>
</section>
<video id="player" playsinline muted autoplay loop preload="auto">
<source src="wedding.mp4" type="video/mp4">
</video>
<button id="sound">Enable sound</button>
<script>
const params=new URLSearchParams(location.search);
const startAt=Number(params.get("start"));
const setup=document.getElementById("setup");
const video=document.getElementById("player");
const sound=document.getElementById("sound");

function createLink(delay){
  const url=new URL(location.href);
  url.search="";
  url.searchParams.set("start",String(Date.now()+delay*1000));
  document.getElementById("share").value=url.toString();
  document.getElementById("status").textContent="Copy this exact link and use it for the wedding display and guests.";
}
document.querySelectorAll("[data-delay]").forEach(b=>b.addEventListener("click",()=>createLink(Number(b.dataset.delay))));
document.getElementById("copy").addEventListener("click",async()=>{
  const field=document.getElementById("share");
  if(!field.value){document.getElementById("status").textContent="Choose a start time first.";return;}
  try{await navigator.clipboard.writeText(field.value);document.getElementById("status").textContent="Shared link copied.";}
  catch(e){field.focus();field.select();document.getElementById("status").textContent="Select and copy the link above.";}
});

function targetTime(){
  const d=video.duration;
  if(!Number.isFinite(d)||d<=0)return 0;
  return ((Math.max(0,Date.now()-startAt)/1000)%d);
}
async function sync(){
  if(!Number.isFinite(video.duration)||video.duration<=0)return;
  if(Date.now()<startAt){video.pause();video.currentTime=0;return;}
  const target=targetTime();
  if(Math.abs(video.currentTime-target)>0.45){
    try{video.currentTime=target;}catch(e){}
  }
  if(video.paused){try{await video.play();}catch(e){}}
}
if(Number.isFinite(startAt)&&startAt>0){
  setup.style.display="none";
  video.style.display="block";
  sound.style.display="block";
  video.addEventListener("loadedmetadata",()=>{sync();setInterval(sync,1200);});
  video.addEventListener("error",()=>{document.body.innerHTML='<p style="padding:24px">Could not load wedding.mp4. Make sure it is in the same repository folder as index.html.</p>';});
  sound.addEventListener("click",()=>{video.muted=false;video.play().catch(()=>{});sound.style.display="none";});
}
</script>
</body>
</html>
